<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캘린더 | Calendar</title>
  <meta name="description" content="세련된 월간 달력 웹 애플리케이션. 일정 추가, 오늘 날짜 확인, 월 이동 기능 제공." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📅</span>
          <span class="logo-text">Calendar</span>
        </div>
      </div>

      <div class="mini-cal-section">
        <div class="today-card">
          <div class="today-label">오늘</div>
          <div class="today-date" id="todayDateDisplay"></div>
          <div class="today-day" id="todayDayDisplay"></div>
        </div>
      </div>

      <div class="upcoming-section">
        <h3 class="section-title">다가오는 일정</h3>
        <div class="upcoming-list" id="upcomingList">
          <p class="no-events-msg">일정이 없습니다</p>
        </div>
      </div>

      <button class="add-event-btn" id="openModalBtn">
        <span class="btn-icon">+</span>
        <span>일정 추가</span>
      </button>
    </aside>

    <!-- Main Calendar -->
    <main class="main-content">
      <div class="calendar-header">
        <div class="nav-group">
          <button class="nav-btn" id="prevBtn" aria-label="이전 달">&#8249;</button>
          <h1 class="month-title" id="monthTitle"></h1>
          <button class="nav-btn" id="nextBtn" aria-label="다음 달">&#8250;</button>
        </div>
        <div class="header-actions">
          <button class="today-btn" id="goTodayBtn">오늘</button>
          <div class="view-toggle">
            <button class="view-btn active" id="monthViewBtn">월</button>
            <button class="view-btn" id="weekViewBtn">주</button>
          </div>
        </div>
      </div>

      <div class="calendar-grid-wrapper">
        <div class="weekday-header">
          <div class="weekday sun">일</div>
          <div class="weekday">월</div>
          <div class="weekday">화</div>
          <div class="weekday">수</div>
          <div class="weekday">목</div>
          <div class="weekday">금</div>
          <div class="weekday sat">토</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </main>
  </div>

  <!-- Event Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="eventModal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">일정 추가</h2>
        <button class="modal-close" id="closeModalBtn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="eventTitle">일정 제목 *</label>
          <input type="text" id="eventTitle" placeholder="일정 제목을 입력하세요" maxlength="50" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">날짜 *</label>
            <input type="date" id="eventDate" />
          </div>
          <div class="form-group">
            <label for="eventTime">시간</label>
            <input type="time" id="eventTime" />
          </div>
        </div>
        <div class="form-group">
          <label for="eventMemo">메모</label>
          <textarea id="eventMemo" placeholder="메모를 입력하세요" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>이모지</label>
          <div class="emoji-picker-wrapper">
            <div class="emoji-cats" id="emojiCats"></div>
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
        </div>
        <div class="form-group">
          <label>색상</label>
          <div class="color-picker" id="colorPicker">
            <button class="color-swatch active" data-color="#4285F4" style="background:#4285F4;" aria-label="파랑"></button>
            <button class="color-swatch" data-color="#EA4335" style="background:#EA4335;" aria-label="빨강"></button>
            <button class="color-swatch" data-color="#FBBC04" style="background:#FBBC04;" aria-label="노랑"></button>
            <button class="color-swatch" data-color="#34A853" style="background:#34A853;" aria-label="초록"></button>
            <button class="color-swatch" data-color="#9334E6" style="background:#9334E6;" aria-label="보라"></button>
            <button class="color-swatch" data-color="#12B5CB" style="background:#12B5CB;" aria-label="청록"></button>
            <button class="color-swatch" data-color="#E52592" style="background:#E52592;" aria-label="핑크"></button>
            <button class="color-swatch" data-color="#F29900" style="background:#F29900;" aria-label="오렌지"></button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelBtn">취소</button>
        <button class="btn-save" id="saveEventBtn">저장</button>
      </div>
    </div>
  </div>

  <!-- Event Detail Popup -->
  <div class="event-popup" id="eventPopup">
    <div class="popup-color-bar" id="popupColorBar"></div>
    <div class="popup-content">
      <div class="popup-header">
        <h3 class="popup-title" id="popupTitle"></h3>
        <button class="popup-close" id="popupClose">&times;</button>
      </div>
      <div class="popup-info" id="popupInfo"></div>
      <div class="popup-memo" id="popupMemo"></div>
      <div class="popup-actions">
        <button class="popup-delete-btn" id="popupDeleteBtn">🗑 삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
